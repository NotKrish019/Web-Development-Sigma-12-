<html lang="en">
  <head>

    <title>Document</title>

  <body>
    <button type="submit">Submit Button outside form</button>
    <form action="/server">
      <div>
        <label for="Username">Name:</label>
        <input type="text" placeholder="Enter your name" id="Username" />

      <div>

          placeholder="Enter your password"
          id="Password"
        />

      <div>
        <label for="age">Age:</label>
        <input type="number" placeholder="Enter Your Age" id="age" />
      </div>
      <button>Submit</button>
      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
      <button type="button">Button</button>

        <input type="button" value="Click Me"/> -->
      <!-- <input type="submit" value="Click Me 2"/> -->

    <hr>
    <form action="https://www.youtube.com/results">
        <input type="text" name="search_query" placeholder="Enter the youtube video you want to search for" />
        <button type="submit">Search</button>
    </form>
  </body>
</html>
